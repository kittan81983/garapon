<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>11/5オリパ</title>
<meta name="apple-mobile-web-app-title" content="抽選">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}*,*::before,*::after{box-sizing:border-box}</style>
<meta name="theme-color" content="#ff345b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: one-screen phone app — pink header with pill buttons, white sheet with slot grid, three round buttons at the bottom */
:root{
  --pink:#ff345b; --pill:#9a3045; --white:#ffffff; --cell:#f1f1f1; --hit:#fbe7ec;
  --gray:#818183; --idx:#7c7c7e; --ink:#000000; --bulk:#fcd1db; --bulk-ink:#eb4168; --reset-ink:#393c43;
  --card:#ffffff; --panel:#fc3458; --num:#fc3458; --rim:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:linear-gradient(var(--pink) 0 50%,var(--white) 50% 100%) fixed}
body{height:100%;margin:0}
body{background:var(--white);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pink)}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--pink)}
header{display:flex;align-items:center;justify-content:space-between;padding-block:3px 13px;padding-left:max(21px,env(safe-area-inset-left,0px));padding-right:max(21px,env(safe-area-inset-right,0px))}
header h1{flex:1;text-align:center;font-size:15px;font-weight:800;margin:0;color:#fff;letter-spacing:.02em}
.pill{display:flex;background:var(--pill);border-radius:19px;height:37px}
.ib{width:51px;height:37px;border:0;background:transparent;color:#fff;display:grid;place-items:center;box-sizing:border-box;border-radius:21px;cursor:pointer;padding:0}
.pill.r .ib{width:55.5px}
.ib:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.ib svg{flex:none}
.sheet-w{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--white);border-radius:12px 12px 0 0}
main{flex:1;overflow-y:auto;padding-block:16.7px;padding-left:max(16.7px,env(safe-area-inset-left,0px));padding-right:max(16.7px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11.7px 9.3px}
.cell{position:relative;aspect-ratio:285/237;max-width:100%;background:var(--cell);border-radius:10px;display:grid;place-items:center;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",var(--font);font-weight:900;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.cell small{position:absolute;top:4px;left:4px;font-family:var(--font);font-size:11px;font-weight:400;color:var(--idx)}
.cell span{margin-top:6px}
.cell .q{color:#7d7d7d;font-weight:800;font-size:22px}
.cell.filled{background:var(--hit)}
.cell.hit{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.bar{display:flex;align-items:center;justify-content:space-between;padding-block:7.7px 8.3px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--white)}
.sub{width:113px;height:113px;border-radius:50%;border:0;font:800 11px var(--font);cursor:pointer;padding:0}
.bulk{background:var(--bulk);color:var(--bulk-ink)}
.reset{background:var(--cell);color:var(--reset-ink)}
.draw{width:140px;height:140px;border-radius:50%;border:0;background:var(--pink);color:#fff;font:800 17px var(--font);cursor:pointer;padding:0;transition:transform .08s,filter .08s}
.sub:active,.draw:active{transform:scale(.95);filter:brightness(.95)}
.draw:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--pill);outline-offset:3px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:1;transition:opacity .15s}

.ov.pre{opacity:0}
.stage{position:absolute;left:50%;top:51.4%;transform:translate(-50%,-50%);width:min(92.7vw,480px);aspect-ratio:1;max-width:100%;border-radius:9px;overflow:hidden;background:var(--panel)}
.rv{position:absolute;inset:0;background:var(--card);clip-path:circle(0% at 50% 50%);-webkit-clip-path:circle(0% at 50% 50%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.num{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);transform-origin:50% 50%;text-align:center;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",var(--font);font-weight:900;color:var(--num);font-size:min(35.7vw,185px);line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;pointer-events:none}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
.tap{display:none}
/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:grid;align-items:end;justify-items:center}
.panel{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.panel h2{margin:0;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.row input{width:110px;font:700 16px var(--font);padding:8px 10px;border:1.5px solid #e2e2e4;border-radius:8px;background:#fff;color:var(--ink);text-align:right}
.ok{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:12px;font:700 15px var(--font);cursor:pointer}
/* bottom ad banner (fictional ads / offline notice) */
.adwrap{background:var(--white);padding-bottom:max(0px,calc(env(safe-area-inset-bottom,0px) - 3px))}
.adwrap.none{padding-bottom:env(safe-area-inset-bottom,0px)}
.adwrap.none .ad{display:none}
.ad{position:relative;height:49px;display:flex;align-items:center;gap:9px;padding:0 30px 0 8px;background:#fff;border-top:1px solid #ececec;border-bottom:1px solid #ececec;overflow:hidden;font-family:-apple-system,"Hiragino Sans",sans-serif}
.ad .ai{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 17px/1 -apple-system,sans-serif;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.ad .ai svg{width:20px;height:20px}
.ad .at{flex:1;min-width:0;line-height:1.25}
.ad .at b{display:block;font-size:13px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad .at span{display:block;font-size:11px;color:#6b6b70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad .ab{flex:none;background:#0a64d8;color:#fff;font:600 13px -apple-system,sans-serif;border-radius:999px;padding:7px 18px}
.ad .ainfo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;border:1.3px solid #2a86e0;color:#2a86e0;font:700 10px/12px Georgia,serif;text-align:center}
.ad .adots{position:absolute;right:9px;top:3px;color:#2a86e0;font:700 9px/1 sans-serif;letter-spacing:-1px}
.ad.off .ai{background:#c7c7cc}
.ad.off .at b{color:#3a3a3c}
/* reset confirm dialog (measured from the original) */
.cfm{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:grid;place-items:center;animation:cfmbg .2s ease-out}
.cfm .box{position:absolute;left:50%;top:51.4%;transform:translate(-50%,-50%);width:min(72.7vw,330px);height:250px;background:#fff;border-radius:11px;display:flex;flex-direction:column;align-items:stretch;padding:19px 17px 15px;animation:cfmin .2s ease-out}
.cfm h3{margin:0;text-align:center;color:#ff383c;font:800 17px/1.2 -apple-system,"Hiragino Sans",sans-serif}
.cfm p{flex:1;margin:0;display:grid;place-items:center;text-align:center;color:#000;font:800 11px/1.43 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.02em}
.cfm .bt{display:grid;grid-template-columns:1fr 1fr;gap:18.7px}
.cfm button{height:40px;border:0;border-radius:9px;font:800 11px -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.05em;cursor:pointer}
.cfm .cn{background:#f4f4f4;color:#8e8e93}
.cfm .ok2{background:#ffd8e0;color:#ff3e68}
@keyframes cfmbg{from{background:rgba(0,0,0,0)}}
@keyframes cfmin{from{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
/* ---- sort menu (↑↓) ---- */
.smenu{position:fixed;inset:0;z-index:35}
.smenu .pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 1px);width:248px;padding:8px 0;border-radius:22px;background:rgba(70,70,72,.78);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:popin .18s ease-out;transform-origin:85% 0}
.smenu button{display:flex;align-items:center;width:100%;height:36px;border:0;background:transparent;color:#fff;font:700 14px -apple-system,"Hiragino Sans",sans-serif;padding:0 0 0 57px;position:relative;text-align:left;cursor:pointer}
.smenu button.on::before{content:"";position:absolute;left:28px;top:50%;width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:translateY(-70%) rotate(-45deg)}
@keyframes popin{from{opacity:0;transform:scale(.85)}}
/* ---- full-height sheets (audio) ---- */
.fsheet{position:fixed;inset:0;z-index:36;background:rgba(0,0,0,.35);animation:fadein .2s}
.fsheet .pg{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 10px);background:#f3f3f3;border-radius:36px 36px 0 0;overflow:hidden;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
.fsheet .hd{height:74px;background:var(--pink);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff}
.fsheet .hd h2{margin:0;font:800 16px -apple-system,"Hiragino Sans",sans-serif}
.cbtn{width:43px;height:43px;border-radius:50%;border:0;background:var(--pill);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.cbtn svg{width:18px;height:18px}
.seg2{margin:16px auto 0;width:299px;height:31px;border-radius:16px;background:#e2e2e2;display:grid;grid-template-columns:1fr 1fr;padding:2px;box-sizing:border-box}
.seg2 button{border:0;border-radius:14px;background:transparent;font:800 13px -apple-system,"Hiragino Sans",sans-serif;color:#000;cursor:pointer}
.seg2 button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opt{margin:58px 20px 0;height:69px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 18px;font:800 14px -apple-system,"Hiragino Sans",sans-serif;color:#3d4350}
.opt .ck{width:14px;height:8px;border-left:3.5px solid #ff345b;border-bottom:3.5px solid #ff345b;transform:rotate(-50deg) translate(2px,-3px);border-radius:1px}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}
/* ---- settings dialog (gear) ---- */
.sdlg{position:fixed;inset:0;z-index:37;background:rgba(0,0,0,.7);animation:fadein .2s}
.sdlg .box{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:min(72.7vw,330px);background:#fff;border-radius:12px;overflow:hidden;animation:cfmin .2s ease-out;font-family:-apple-system,"Hiragino Sans",sans-serif}
.sdlg h3{margin:0;height:49px;display:grid;place-items:center;font:800 15px -apple-system,"Hiragino Sans",sans-serif;border-bottom:1px solid #ececec}
.sdlg .r{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:11.5px;color:#111;border-bottom:1px solid #f0f0f0}
.sdlg .r .v{color:#ff345b}
.sdlg .lk{height:50px;display:grid;place-items:center;font-weight:800;font-size:11.5px;color:#111;border-bottom:1px solid #f0f0f0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.sdlg .lk:last-child{border-bottom:0}
.sdlg .lk.red{color:#ff383c}
.tg{width:62px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;border:0;cursor:pointer;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tg.on{background:#ff345b}
.tg.on::after{left:33px}
/* ---- event list screen (✕) ---- */
.evl{position:fixed;inset:0;z-index:34;background:#f3f3f3;display:flex;flex-direction:column;animation:fadein .15s}
.evl .hd{background:var(--pink);padding:calc(env(safe-area-inset-top,0px) + 2px) 18px 14px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.evl .hd h2{margin:0;font:800 16px -apple-system,"Hiragino Sans",sans-serif}
.evl .rb{width:40px;height:40px;border-radius:50%;background:#f29bc8;border:1.5px solid rgba(255,255,255,.45);display:grid;place-items:center;color:#fff}
.evl .rb svg{width:22px;height:22px}
.evl .chips{display:flex;gap:11px;padding:10px 15px}
.evl .chip{height:30px;padding:0 13px;border-radius:15px;display:grid;place-items:center;font:800 12.5px -apple-system,"Hiragino Sans",sans-serif;background:#e8e8e8;color:#8e8e93;min-width:61px;box-sizing:border-box}
.evl .chip.on{background:var(--pink);color:#fff}
.evl .card{margin:14px 15px 0;background:#fff;border-radius:22px;padding:15px 16px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.evl .card .t{display:flex;align-items:center;justify-content:space-between;font:800 11.5px -apple-system,"Hiragino Sans",sans-serif}
.evl .card .k{color:var(--pink);display:flex;align-items:center;gap:9px}
.evl .card .k i{display:inline-grid;place-items:center;width:15px;height:12px;border:1.6px solid var(--pink);border-radius:3px;font:800 6px/1 -apple-system,sans-serif;font-style:normal}
.evl .card .c{color:#8e8e93}
.evl .card b{display:block;margin-top:6px;font:900 21px -apple-system,"Hiragino Sans",sans-serif;color:#000}
.evl .fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 75px);width:44px;height:44px;border-radius:50%;background:var(--pink);border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;color:#fff}
.evl .search{position:absolute;left:26px;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:44px;border-radius:22px;background:#fbfbfb;box-shadow:0 4px 16px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;padding:0 17px;color:#8e8e93;font:800 13px -apple-system,"Hiragino Sans",sans-serif}
@media (prefers-reduced-motion:reduce){.cell.hit,.num.show{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="pill">
      <button class="ib" id="btnClose" aria-label="閉じる" style="width:43px"><svg style="width:18px;height:18px" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M2 2l14 14M16 2L2 16"/></svg></button>
      <button class="ib" id="btnShuffle" aria-label="並び替え" style="width:59.3px;padding-left:10px"><svg style="width:22px;height:22px" viewBox="0 0 22 22" fill="currentColor"><rect x="0" y="4" width="11" height="2.4" rx="1.2"/><rect x="0" y="8.8" width="11" height="2.4" rx="1.2"/><rect x="0" y="13.6" width="7.5" height="2.4" rx="1.2"/><path d="M15.2 1.2h2.6v15.3a3.9 3.9 0 1 1-2.6-3.7z"/><path d="M17.8 1.2c1 1.4 2.4 1.9 3.6 1.7v2.7c-1.4.2-2.6-.2-3.6-.9z"/></svg></button>
    </div>
    <h1 id="title">11/5オリパ</h1>
    <div class="pill r">
      <button class="ib" id="btnSort" aria-label="順番" style="width:52px"><svg style="width:26px;height:21px" viewBox="0 0 26 21" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 19.4V1.8M1.8 7.5l5.7-5.7 5.7 5.7M18.5 1.6v17.6M12.8 13.5l5.7 5.7 5.7-5.7"/></svg></button>
      <button class="ib" id="btnSettings" aria-label="設定" style="width:59px;padding-left:10px"><svg style="width:29px;height:29px" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.1 0.6h3.8l.6 3c.8.3 1.5.7 2.2 1.3l2.9-1 1.9 3.3-2.3 2c.1.9.1 1.7 0 2.6l2.3 2-1.9 3.3-2.9-1c-.7.5-1.4 1-2.2 1.3l-.6 3h-3.8l-.6-3c-.8-.3-1.5-.7-2.2-1.3l-2.9 1-1.9-3.3 2.3-2c-.1-.9-.1-1.7 0-2.6l-2.3-2 1.9-3.3 2.9 1c.7-.5 1.4-1 2.2-1.3zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></button>
    </div>
  </header>
  <div class="sheet-w">
    <main><div class="grid" id="grid"></div></main>
    <div class="bar">
      <button class="sub bulk" id="btnBulk">一括抽選</button>
      <button class="draw" id="btnDraw">抽選</button>
      <button class="sub reset" id="btnReset">リセット</button>
    </div>
    <div class="adwrap" id="adwrap" aria-hidden="true"><div class="ad" id="ad"></div></div>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="rv" id="rv"><div class="num" id="num"></div></div>
    <div class="tap" id="tap" hidden></div>
  </div>
  <canvas id="cf"></canvas>
</div>

<div class="cfm" id="cfm" hidden>
  <div class="box" role="dialog" aria-labelledby="cfmT">
    <h3 id="cfmT">注意</h3>
    <p id="cfmM">抽選結果をリセットしますか？<br>この操作は取り消すことができません</p>
    <div class="bt"><button class="cn" id="cfmNo">キャンセル</button><button class="ok2" id="cfmYes">リセット</button></div>
  </div>
</div>

<div class="smenu" id="smenu" hidden><div class="pop">
  <button data-o="draw" class="on">抽選順</button><button data-o="asc">小さい順</button><button data-o="desc">大きい順</button>
</div></div>

<div class="fsheet" id="audio" hidden><div class="pg">
  <div class="hd"><button class="cbtn" id="audClose" aria-label="閉じる"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M2 2l14 14M16 2L2 16"/></svg></button><h2>オーディオ管理</h2><button class="cbtn" aria-label="読み込み"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M10 1.5v9M6.3 7l3.7 3.7L13.7 7"/><path d="M4.5 9.5h-1a1.5 1.5 0 0 0-1.5 1.5v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1.5 1.5 0 0 0-1.5-1.5h-1" /></svg></button></div>
  <div class="seg2" id="audSeg"><button class="on" data-t="se">効果音</button><button data-t="bgm">BGM</button></div>
  <div class="opt" id="audOpt"><span id="audName">デフォルト</span><span class="ck"></span></div>
</div></div>

<div class="sdlg" id="sdlg" hidden><div class="box" role="dialog">
  <h3>設定</h3>
  <div class="r"><span>アニメーション時間</span><span class="v">2 秒</span></div>
  <div class="r"><span>1行あたりの項目数</span><span class="v">四つ</span></div>
  <div class="r"><span>効果音</span><button class="tg on" data-k="se" aria-label="効果音"></button></div>
  <div class="r"><span>BGM</span><button class="tg on" data-k="bgm" aria-label="BGM"></button></div>
  <div class="r"><span>一括抽選前にメッセージを通知する</span><button class="tg on" data-k="askBulk" aria-label="一括抽選前に通知"></button></div>
  <div class="r"><span>結果リセット前にメッセージを通知する</span><button class="tg on" data-k="askReset" aria-label="リセット前に通知"></button></div>
  <button class="lk" id="lkEvent">抽選イベント設定</button>
  <button class="lk" id="lkPdf">抽選結果をエクスポート（PDF）</button>
  <button class="lk red" id="lkDel">抽選イベントを削除</button>

<script>
(() => {
const $ = id => document.getElementById(id);
const S = { title:"11/5オリパ", min:1, max:150, slots:28, ad:"ads", order:"draw", se:true, bgm:true, askBulk:true, askReset:true, audSe:"default" };
try { Object.assign(S, JSON.parse(localStorage.getItem("garapon-settings")||"{}")); } catch(e){}
let drawn = [];
try{ const dv=JSON.parse(localStorage.getItem("garapon-drawn")||"[]"); if(Array.isArray(dv)) drawn=dv.map(Number).filter(n=>isFinite(n)); }catch(e){}
let busy = false;
let queue = [], banned = [];
try{ const sv=JSON.parse(localStorage.getItem("garapon-secret")||"{}"); queue=sv.queue||[]; banned=sv.banned||[]; }catch(e){}
function saveSecret(){ try{ localStorage.setItem("garapon-secret",JSON.stringify({queue,banned})); }catch(e){} }

/* ---------- 操作側との連携（ntfy.sh 経由） ---------- */
const me=Math.random().toString(36).slice(2,9);
let room="", es=null;
try{ room=(localStorage.getItem("garapon-room")||""); }catch(e){}
const qp=new URLSearchParams(location.search).get("room"); if(qp) { room=qp.toUpperCase(); try{localStorage.setItem("garapon-room",room);}catch(e){} }
function topic(){ return "garapon-v1-"+room.toLowerCase(); }
function connect(){
  if(es){ es.close(); es=null; } if(!room) return;
  es=new EventSource("https://ntfy.sh/"+topic()+"/sse");
  es.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.event && d.event!=="message") return; const m=JSON.parse(d.message); if(m.from===me) return; onRemote(m); }catch(_){} };
  es.onopen=()=>sendState();
}
function send(m){ if(!room) return; m.from=me; m.at=Date.now(); fetch("https://ntfy.sh/"+topic(),{method:"POST",body:JSON.stringify(m)}).catch(()=>{}); }
function sendState(){ saveSecret(); send({t:"state", drawn, queue, banned, min:S.min, max:S.max, slots:S.slots, busy, open:!document.getElementById("ov").hidden}); }
function setRoom(r){ room=r; try{localStorage.setItem("garapon-room",room);}catch(e){} connect(); }
function onRemote(m){
  if(m.t==="hello"){ sendState(); }
  else if(m.t==="queue"){ queue=(m.queue||[]).map(Number).filter(n=>isFinite(n)); render(); sendState(); }
  else if(m.t==="ban"){ banned=(m.banned||[]).map(Number).filter(n=>isFinite(n)); render(); sendState(); }
  else if(m.t==="draw"){ if(closeResolve && phase==="result"){ closeResolve(); } else if(!busy){ document.getElementById("btnDraw").click(); } }
  else if(m.t==="close"){ closeResolve && closeResolve(); }
  else if(m.t==="bulk"){ if(!busy) doBulk(); }
  else if(m.t==="undo"){ if(!busy && drawn.length){ drawn.pop(); render(); sendState(); } }
  else if(m.t==="reset"){ if(!busy){ drawn=[]; render(); sendState(); } }
  else if(m.t==="set"){ if(!busy && Array.isArray(m.drawn)){ drawn=m.drawn.map(Number); render(); sendState(); } }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) connect(); });


function pool(){ const a=[]; for(let n=S.min;n<=S.max;n++) if(!drawn.includes(n) && !banned.includes(n)) a.push(n); return a; }
function render(){
  try{ localStorage.setItem("garapon-drawn",JSON.stringify(drawn)); }catch(e){}
  $("title").textContent = S.title;
  const g=$("grid"); g.innerHTML="";
  const count=Math.max(S.slots, drawn.length);
  const disp = S.order==="asc" ? drawn.slice().sort((a,b)=>a-b) : S.order==="desc" ? drawn.slice().sort((a,b)=>b-a) : drawn;
  for(let i=0;i<count;i++){
    const c=document.createElement("div"); c.className="cell";
    c.innerHTML=`<small>${i+1}</small>`+(disp[i]!=null?`<span>${disp[i]}</span>`:`<span class="q">?</span>`);
    if(disp[i]!=null){ c.classList.add("filled"); c.dataset.n=disp[i]; }
    g.appendChild(c);
  }
  $("btnDraw").disabled = (pool().length===0 && !queue.length) || drawn.length>=S.slots;
}
function markHit(i){ const c=$("grid").querySelector(`.cell[data-n="${drawn[i]}"]`); if(c){ c.classList.add("hit"); c.scrollIntoView({block:"nearest",behavior:"smooth"}); } }

/* ---------- canvas wheel ---------- */
const cv=$("cv"), ctx=cv.getContext("2d"), cf=$("cf"), fx=cf.getContext("2d");
let W=0, DPR=1, SW=0, SH=0, panelBox=null;
function fit(){
  DPR=Math.min(3,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect(); W=r.width; cv.width=r.width*DPR; cv.height=r.height*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  SW=innerWidth; SH=innerHeight; cf.width=SW*DPR; cf.height=SH*DPR; fx.setTransform(DPR,0,0,DPR,0,0);
  const sb=$("stage").getBoundingClientRect(), cb=cf.getBoundingClientRect(); panelBox={x:sb.left-cb.left,y:sb.top-cb.top,w:sb.width,h:sb.height};
}
const COLORS=["#009dd6","#009dd6","#009dd6","#00468e","#00468e","#fec600","#fec600","#2eff00","#2eff00","#2eff00","#fe82c6","#fe82c6"];
let balls=[], angle=0, spin=0, lastShuffle=0;
// 実機と同じ動き: 玉は物理計算せず、0.1秒ごとに中の並びがパッと入れ替わる（これが「震え」に見える）
const BR=.211, INNER=.744;
function initBalls(){
  const order=COLORS.slice().sort(()=>Math.random()-.5);
  balls=[];
  for(const c of order){ let best=null, bestD=-1; const up=Math.random()<.22;
    for(let k=0;k<60;k++){ const a=Math.random()*Math.PI*2; let r=Math.sqrt(Math.random())*INNER;
      let x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(!up){ // 底にたまる玉
        y=.15+Math.random()*.6; const lim=Math.sqrt(Math.max(0,INNER*INNER-y*y)); x=(Math.random()*2-1)*lim; }
      let md=9; for(const o of balls) md=Math.min(md,Math.hypot(o.x-x,o.y-y));
      if(md>BR*1.7){ best={x,y}; break; } if(md>bestD){ bestD=md; best={x,y}; } }
    balls.push({x:best.x,y:best.y,c}); }
}
// 実機の「震え」: ガラポン全体が0.1秒周期で右下へ約2pt動いて戻る（玉の入れ替えと同じ周期）
const SHAKE=[0,1/6,4/6,1,1,2.5/6]; let shake=0;
function step(dt){ const now=performance.now(); if(now-lastShuffle>=100){ lastShuffle=now; initBalls(); }
  shake=SHAKE[Math.min(5,Math.floor((now-lastShuffle)/100*6))]; }
function drawWheel(out){
  const s=W, cx=s*.499, cy=s*.45, R=s*.323, line=getComputedStyle(document.documentElement).getPropertyValue("--rim").trim()||"#fde4dd";
  ctx.clearRect(0,0,s,s);
  ctx.save(); const sh=shake*s*.0049; ctx.translate(sh,sh);
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=line;
  // stand
  ctx.lineCap="butt"; const fy=cy+R*1.32;
  ctx.lineWidth=s*.0106; ctx.beginPath(); ctx.moveTo(cx-R*.347,cy+R*1.0); ctx.lineTo(cx-R*.435,fy); ctx.moveTo(cx+R*.347,cy+R*1.0); ctx.lineTo(cx+R*.435,fy); ctx.stroke();
  ctx.lineWidth=s*.014; ctx.beginPath(); ctx.moveTo(cx-R*.592,fy); ctx.lineTo(cx+R*.592,fy); ctx.stroke(); ctx.lineCap="round";
  // balls
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  for(const b of balls){ ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(cx+b.x*R,cy+b.y*R,BR*R,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
  // spokes
  ctx.lineWidth=s*.013; const hr=R*.156;
  for(let i=0;i<3;i++){ const a=angle+i*Math.PI*2/3; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*hr,cy+Math.sin(a)*hr); ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); ctx.stroke(); }
  // rim + hub ring
  ctx.lineWidth=s*.0286; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--panel").trim()||"#fc3458"; ctx.lineWidth=s*.018; ctx.beginPath(); ctx.arc(cx,cy,hr,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
  // big translucent ball with the number zooming out of the drum
  if(out){ const r=R*(.25+.85*out.k);
    ctx.fillStyle=`rgba(255,240,236,${.55+.3*out.k})`; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=s*.008; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.stroke();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--num").trim()||"#e8384f";
    ctx.font=`800 ${r*.5}px "Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(out.n,cx,cy+r*.04); }
}

let bits=[], revealE=0;
function initConfetti(){ bits=CONF; }
function drawConfetti(t, alpha, revealing){
  fx.clearRect(0,0,SW,SH); if(alpha<=0) return; fx.globalAlpha=alpha; fx.save();
  const P=panelBox, cx=P.x+P.w*.499, cy=P.y+P.h*.45;
  if(revealing){ const pr=Math.max(.001,revealE)*Math.hypot(P.w,P.h)/2;
    fx.beginPath(); fx.arc(cx,cy,pr,0,Math.PI*2); fx.clip();
    const sc=.35+.65*revealE; fx.translate(cx,cy); fx.scale(sc,sc); fx.translate(-cx,-cy); }
  for(const [c,pts] of CONF){ fx.fillStyle=c; fx.beginPath();
    for(let i=0;i<pts.length;i+=2){ const x=P.x+pts[i]*P.w, y=P.y+pts[i+1]*P.h; i?fx.lineTo(x,y):fx.moveTo(x,y); }
    fx.closePath(); fx.fill(); }
  fx.restore(); fx.globalAlpha=1;
}

/* ---------- sequence: spin → ball comes out → number + confetti → closes by itself ---------- */
let raf=0, phase="", closeResolve=null;
function runDraw(n, fast, onReveal){
  return new Promise(res=>{
    const ov=$("ov"), st=$("stage"), num=$("num"), rv=$("rv");
    const clip=v=>{ rv.style.clipPath=v; rv.style.webkitClipPath=v; };
    ov.classList.remove("out"); ov.classList.add("pre"); ov.hidden=false;
    requestAnimationFrame(()=>ov.classList.remove("pre")); clip("circle(0% at 49.9% 45%)"); num.textContent=(n===null?"":n); num.style.transform="translateY(-50%) scale(.35)"; rv.style.opacity=".85";
    fit(); initBalls(); angle=0; spin=0; bits=[]; fx.clearRect(0,0,SW,SH);
    const bulk=(n===null); const SPIN=bulk?2.1:(fast?.8:2.3), EMERGE=fast?.15:.27, HOLD=fast?.5:.9, FADE=fast?.15:.25, PLAIN=fast?.1:.45, OUT=fast?.15:.5;
    let t0=performance.now(), last=t0; phase="spin";
    cancelAnimationFrame(raf);
    const loop=now=>{
      const dt=Math.min(.033,(now-last)/1000); last=now; const t=(now-t0)/1000;
      if(phase==="spin"){
        spin=1.57;
        angle+=spin*dt; step(dt); drawWheel(null);
        if(t>=SPIN){ phase=bulk?"closing":"emerge"; t0=now; }
      } else if(phase==="emerge"){
        angle+=spin*dt; step(dt); drawWheel(null);
        if(!bits.length){ initConfetti(); onReveal&&onReveal(); }
        const k=Math.min(1,t/EMERGE), e=1-Math.pow(1-k,2); revealE=.1+.9*e; clip(`circle(${(9+e*71).toFixed(2)}% at 49.9% 45%)`);
        num.style.transform=`translateY(-50%) scale(${(.35+.65*e).toFixed(3)})`; rv.style.opacity=(.85+.15*e).toFixed(3);
        drawConfetti(0, 1, true);
        if(t>=EMERGE){ phase="result"; t0=now; clip("none"); num.style.transform=""; rv.style.opacity=""; ctx.clearRect(0,0,W,W); sendState(); }
      } else if(phase==="result"){
        const a = t<HOLD?1:Math.max(0,1-(t-HOLD)/FADE);
        drawConfetti(t,a);
        if(t>=HOLD+FADE+PLAIN){ phase="closing"; t0=now; }
      } else if(phase==="closing"){
        ov.style.transition="none"; const o=Math.max(0,1-t/(bulk?.25:OUT)); ov.style.opacity=o.toFixed(3);
        if(o<=0){ finish(); return; }
      }
      raf=requestAnimationFrame(loop);
    };
    const finish=()=>{ cancelAnimationFrame(raf); phase=""; fx.clearRect(0,0,SW,SH); ov.hidden=true; ov.classList.remove("out"); ov.style.opacity=""; ov.style.transition=""; closeResolve=null; res(); };
    closeResolve=()=>{ if(phase==="result"){ phase="closing"; t0=performance.now(); } };
    raf=requestAnimationFrame(loop);
  });
}
$("ov").addEventListener("click",()=>closeResolve&&closeResolve());

async function drawOne(fast){
  const p=pool(); if((!p.length && !queue.length)||drawn.length>=S.slots) return false;
  const n = queue.length ? queue.shift() : p[Math.floor(Math.random()*p.length)];
  await runDraw(n, fast, ()=>{ drawn.push(n); render(); markHit(drawn.length-1); });
  sendState(); return true;
}
$("btnDraw").onclick=async()=>{ if(busy) return; busy=true; await drawOne(false); busy=false; };
// 一括抽選: 確認 → ガラポンが1回回る → 消えたら残りのマスが全部一気に埋まる（実機と同じ）
async function doBulk(){
  if(busy) return; const left=Math.max(0,S.slots-drawn.length); if(!left) return;
  busy=true; const picks=[];
  for(let k=0;k<left;k++){ let n=null;
    if(queue.length) n=queue.shift();
    else { const p=pool().filter(x=>!picks.includes(x)); if(!p.length) break; n=p[Math.floor(Math.random()*p.length)]; }
    picks.push(n); }
  if(picks.length){ await runDraw(null,false); drawn.push(...picks); render(); sendState(); }
  busy=false;
}
let cfmAction=null;
function confirmBox(title,titleColor,msg,okLabel,action){ $("cfmT").textContent=title; $("cfmT").style.color=titleColor; $("cfmM").innerHTML=msg; $("cfmYes").textContent=okLabel; cfmAction=action; $("cfm").hidden=false; }
$("btnBulk").onclick=()=>{ if(busy || drawn.length>=S.slots) return; if(S.askBulk===false){ doBulk(); return; } confirmBox("メッセージ","#000","すべての賞品を一括抽選しますか？","一括抽選",doBulk); };

/* reset with in-page confirm (tap twice) */
$("btnReset").onclick=()=>{ if(busy) return; if(S.askReset===false){ drawn=[]; render(); sendState(); return; } confirmBox("注意","#ff383c","抽選結果をリセットしますか？<br>この操作は取り消すことができません","リセット",()=>{ drawn=[]; render(); sendState(); }); };
$("cfmNo").onclick=()=>{ $("cfm").hidden=true; cfmAction=null; };
$("cfmYes").onclick=()=>{ $("cfm").hidden=true; const a=cfmAction; cfmAction=null; a&&a(); };

/* settings */
function openEventSettings(){ $("inTitle").value=S.title; $("inMin").value=S.min; $("inMax").value=S.max; $("inSlots").value=S.slots; $("inRoom").value=room; $("inAd").value=S.ad||"ads"; $("sheet").hidden=false; };
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("sheet").hidden=true; });
$("btnOk").onclick=()=>{
  const mn=parseInt($("inMin").value,10), mx=parseInt($("inMax").value,10), sl=parseInt($("inSlots").value,10);
  if(isFinite(mn)&&isFinite(mx)&&mx>mn){ S.min=mn; S.max=mx; }
  if(isFinite(sl)&&sl>0&&sl<=400) S.slots=sl;
  S.title=$("inTitle").value.trim()||S.title;
  const rc=$("inRoom").value.trim().toUpperCase(); if(rc!==room){ setRoom(rc); }
  try{ localStorage.setItem("garapon-settings",JSON.stringify(S)); }catch(e){}
  drawn=[]; $("sheet").hidden=true; render(); sendState(); };
function saveS(){ try{ localStorage.setItem("garapon-settings",JSON.stringify(S)); }catch(e){} }
/* ↑↓ 並び順メニュー */
$("btnSort").onclick=()=>{ document.querySelectorAll("#smenu button").forEach(b=>b.classList.toggle("on",b.dataset.o===(S.order||"draw"))); $("smenu").hidden=false; };
$("smenu").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ S.order=b.dataset.o; saveS(); render(); } $("smenu").hidden=true; });
/* ⚙ 設定ダイアログ */
$("btnSettings").onclick=()=>{ document.querySelectorAll("#sdlg .tg").forEach(t=>t.classList.toggle("on",S[t.dataset.k]!==false)); $("sdlg").hidden=false; };
$("sdlg").addEventListener("click",e=>{ if(e.target.id==="sdlg"){ $("sdlg").hidden=true; return; } const t=e.target.closest(".tg"); if(t){ S[t.dataset.k]=!(S[t.dataset.k]!==false); t.classList.toggle("on",S[t.dataset.k]); saveS(); } });
$("lkBack").onclick=()=>{ $("sdlg").hidden=true; };
$("lkEvent").onclick=()=>{ $("sdlg").hidden=true; openEventSettings(); };
$("lkPdf").onclick=()=>{}; $("lkDel").onclick=()=>{};
/* ♪ オーディオ管理 */
$("btnShuffle").onclick=()=>{ setAudTab("se"); $("audio").hidden=false; };
function setAudTab(t){ document.querySelectorAll("#audSeg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); $("audName").textContent = t==="se"?"デフォルト":"なし"; }
$("audSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setAudTab(b.dataset.t); });
$("audClose").onclick=()=>{ $("audio").hidden=true; };
/* ✕ 抽選イベントリスト */
$("btnClose").onclick=()=>{ $("evTitle").textContent=S.title; $("evCount").textContent=`抽選済み ${drawn.length}/${S.max-S.min+1}`; $("evl").hidden=false; };
$("evCard").onclick=()=>{ $("evl").hidden=true; };
addEventListener("resize",()=>{ if(!$("ov").hidden) fit(); });

/* ---------- 下の広告（架空の広告2本を交互に / 機内モード表示） ---------- */
const PLANE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>';
const ADS=[
  {ic:'<span style="background:#27b36a;width:100%;height:100%;border-radius:8px;display:grid;place-items:center">¥</span>',t:"ポケット家計簿",s:"レシートを撮るだけで、家計簿が自動で完成",b:"入手"},
  {ic:'<span style="background:#ff8a00;width:100%;height:100%;border-radius:8px;display:grid;place-items:center">英</span>',t:"ハナマル英会話 オンライン",s:"1回25分・初回の無料体験レッスン受付中",b:"開く"}
];
let adIdx=0, adTimer=0;
function showAd(){
  const w=$("adwrap"), el=$("ad"); w.classList.toggle("none",S.ad==="none"); el.classList.toggle("off",S.ad==="offline");
  if(S.ad==="offline"){ el.innerHTML='<div class="ai">'+PLANE+'</div><div class="at"><b>機内モードがオンです</b><span>インターネットに接続されていないため、広告を表示できません</span></div><span class="ainfo">i</span>'; return; }
  const a=ADS[adIdx%ADS.length]; el.innerHTML='<div class="ai">'+a.ic+'</div><div class="at"><b>'+a.t+'</b><span>'+a.s+'</span></div><div class="ab">'+a.b+'</div><span class="adots">⋮</span>';
}
function applyAd(){ clearInterval(adTimer); showAd(); if(S.ad==="ads") adTimer=setInterval(()=>{ adIdx++; showAd(); },15000); }
$("inAd").addEventListener("change",()=>{ S.ad=$("inAd").value; try{ localStorage.setItem("garapon-settings",JSON.stringify(S)); }catch(e){} applyAd(); });
applyAd();
render();
connect();
})();
</script>
</body>
</html>

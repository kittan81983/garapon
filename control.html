<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>操作パネル</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="操作">
<meta name="theme-color" content="#16161a">
<link rel="apple-touch-icon" href="icon-control.png">
<style>
/* Layout: dark one-column remote — status strip, number pad for the forced numbers, remote buttons, mirror of the display grid */
:root{
  --bg:#16161a; --panel:#222228; --line:#2f2f37; --fg:#f2f2f5; --dim:#8b8b96;
  --pink:#ea506a; --ok:#3ecf8e; --warn:#f5b84a;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:480px;margin:0 auto;display:grid;gap:12px}
.status{display:flex;align-items:center;gap:10px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status .txt{flex:1;color:var(--dim)}
.code{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font:700 14px var(--font);letter-spacing:.12em;cursor:pointer}
.card{background:var(--panel);border-radius:14px;padding:12px;display:grid;gap:10px}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.08em}
.entry{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.entry .val{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-height:52px;letter-spacing:.02em}
.entry .val.empty{color:var(--dim);font-size:16px;font-weight:500}
.entry .warn{font-size:11px;color:var(--warn)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:52px;border-radius:10px;border:0;background:#2c2c34;color:var(--fg);font:700 22px var(--font);cursor:pointer}
.k:active{background:#3a3a44}
.k.add{background:var(--pink);font-size:16px}
.k.del{font-size:16px}
.queue{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.chip{background:#3a2a30;color:#ffd7de;border:1px solid #5a3440;border-radius:999px;padding:6px 12px;font:700 16px var(--font);font-variant-numeric:tabular-nums;cursor:pointer}
.chip:first-child{background:var(--pink);color:#fff;border-color:var(--pink)}
.queue .none{color:var(--dim);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#2c2c34;border-radius:10px;padding:3px;gap:3px}
.seg button{height:38px;border:0;border-radius:8px;background:transparent;color:var(--dim);font:700 14px var(--font);cursor:pointer}
.seg button.on{background:#44444f;color:var(--fg)}
.seg button.on.ban{background:#5a4a1f;color:#ffd98a}
.k.add.ban{background:#b8892a}
.chip.ban{background:#3a3220;color:#ffe2a8;border-color:#5c4c25;text-decoration:line-through}
.queue.banq .chip:first-child{background:#3a3220;color:#ffe2a8;border-color:#5c4c25}
.m.x{color:#6b5a30;text-decoration:line-through}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:54px;border-radius:12px;border:1px solid var(--line);background:#2c2c34;color:var(--fg);font:700 15px var(--font);cursor:pointer}
.btn:active{filter:brightness(1.25)}
.btn.big{grid-column:1/-1;height:72px;background:var(--pink);border-color:var(--pink);font-size:20px}
.btn.danger{color:#ff8a9b}
.btn.armed{background:#5a1f2a}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mirror{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.m{aspect-ratio:1;max-width:100%;border-radius:5px;background:#2c2c34;display:grid;place-items:center;font:700 12px var(--font);color:var(--dim);font-variant-numeric:tabular-nums}
.m.f{background:#3a2a30;color:#fff}
.m.n{outline:2px solid var(--pink)}
.foot{font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:5}
.sheet .card{width:100%;max-width:360px}
.sheet input{width:100%;font:700 22px var(--font);letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#2c2c34;color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="txt" id="stxt">表示側を探しています…</span>
    <button class="code" id="codeBtn">------</button>
  </div>

  <div class="card">
    <div class="seg" id="seg"><button class="on" data-m="q">出す番号（予約）</button><button data-m="b">出さない番号（除外）</button></div>
    <div class="entry"><span class="val empty" id="val">番号を入力</span><span class="warn" id="warn"></span></div>
    <div class="pad" id="pad">
      <button class="k">1</button><button class="k">2</button><button class="k">3</button>
      <button class="k">4</button><button class="k">5</button><button class="k">6</button>
      <button class="k">7</button><button class="k">8</button><button class="k">9</button>
      <button class="k del" data-k="del">⌫</button><button class="k">0</button><button class="k add" data-k="add" id="addKey">予約</button>
    </div>
    <div class="lbl">予約の順番（タップで消す）</div>
    <div class="queue" id="queue"><span class="none">予約なし（ランダムで出ます）</span></div>
    <div class="lbl">出さない番号（タップで消す）</div>
    <div class="queue banq" id="banq"><span class="none">除外なし</span></div>
  </div>

  <div class="row">
    <button class="btn" id="bClose" style="grid-column:1/-1">結果を閉じる</button>
    <button class="btn" id="bClear">予約を全部消す</button>
    <button class="btn" id="bClearBan">除外を全部消す</button>
  </div>

  <div class="card">
    <div class="lbl" id="mlbl">表示側のマス</div>
    <div class="mirror" id="mirror"></div>
  </div>

  <div class="foot">表示側の歯車 → 「抽選イベント設定」→「連携コード」に右上のコードを入れるとつながります。<br>予約した番号は、表示側で「抽選」が押されたときに順番に出ます。<br>除外した番号は、ランダムでも一括抽選でも出ません。</div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card">
    <div class="lbl">連携コード</div>
    <input id="inCode" type="text" autocomplete="off" autocapitalize="characters" maxlength="10">
    <div class="row">
      <button class="btn" id="bNew">新しく作る</button>
      <button class="btn" id="bSave" style="background:var(--pink);border-color:var(--pink)">決定</button>
    </div>
  </div>
</div>

<script>
(() => {
const $=id=>document.getElementById(id);
const me=Math.random().toString(36).slice(2,9);
const gen=()=>{ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
let room=""; try{ room=localStorage.getItem("garapon-ctl-room")||""; }catch(e){}
if(!room){ room=gen(); try{localStorage.setItem("garapon-ctl-room",room);}catch(e){} }
let es=null, lastSeen=0, state=null, queue=[], banned=[], entry="", mode="q";

function topic(){ return "garapon-v1-"+room.toLowerCase(); }
function connect(){
  if(es){ es.close(); es=null; }
  $("codeBtn").textContent=room;
  es=new EventSource("https://ntfy.sh/"+topic()+"/sse");
  es.onopen=()=>send({t:"hello"});
  es.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.event && d.event!=="message") return; const m=JSON.parse(d.message); if(m.from===me) return;
    if(m.t==="state"){ state=m; lastSeen=Date.now(); queue=(m.queue||[]).slice(); banned=(m.banned||[]).slice(); render(); } }catch(_){} };
}
function send(m){ m.from=me; m.at=Date.now(); return fetch("https://ntfy.sh/"+topic(),{method:"POST",body:JSON.stringify(m)}).catch(()=>{}); }
function pushQueue(){ render(); send({t:"queue",queue}); }
function pushBan(){ render(); send({t:"ban",banned}); }

function render(){
  const v=$("val"); if(entry){ v.textContent=entry; v.classList.remove("empty"); } else { v.textContent="番号を入力"; v.classList.add("empty"); }
  let w=""; const n=Number(entry);
  if(entry && state){ if(state.drawn.includes(n)) w="もう出ている番号です"; else if(n<state.min||n>state.max) w=`範囲外（${state.min}〜${state.max}）`; }
  if(entry && mode==="q" && banned.includes(n)) w="除外に入っている番号です（予約が優先されます）";
  if(entry && mode==="b" && banned.includes(n)) w="もう除外に入っています";
  $("addKey").textContent = mode==="q" ? "予約" : "除外"; $("addKey").classList.toggle("ban",mode==="b");
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  const bq=$("banq"); bq.innerHTML="";
  if(!banned.length) bq.innerHTML='<span class="none">除外なし</span>';
  banned.forEach((x,i)=>{ const c=document.createElement("button"); c.className="chip ban"; c.textContent=x; c.onclick=()=>{ banned.splice(i,1); pushBan(); }; bq.appendChild(c); });
  $("warn").textContent=w;
  const q=$("queue"); q.innerHTML="";
  if(!queue.length) q.innerHTML='<span class="none">予約なし（ランダムで出ます）</span>';
  queue.forEach((x,i)=>{ const c=document.createElement("button"); c.className="chip"; c.textContent=(i===0?"次 ":"")+x; c.onclick=()=>{ queue.splice(i,1); pushQueue(); }; q.appendChild(c); });
  const on=Date.now()-lastSeen<60000 && state;
  $("dot").classList.toggle("on",!!on);
  $("stxt").textContent = on ? `表示側とつながっています（${state.drawn.length}個 抽選済み）` : (state? "表示側の応答がありません" : "表示側を探しています…");
  const mr=$("mirror"); mr.innerHTML="";
  if(state){ const cnt=Math.max(state.slots,state.drawn.length);
    for(let i=0;i<cnt;i++){ const d=document.createElement("div"); d.className="m";
      if(state.drawn[i]!=null){ d.classList.add("f"); d.textContent=state.drawn[i]; } else { d.textContent=i+1; if(i===state.drawn.length) d.classList.add("n"); }
      mr.appendChild(d); }
    $("mlbl").textContent=`表示側のマス（${state.min}〜${state.max}）`; }
}

$("pad").addEventListener("click",e=>{ const b=e.target.closest(".k"); if(!b) return; const k=b.dataset.k;
  if(k==="del") entry=entry.slice(0,-1);
  else if(k==="add"){ if(entry){ const n=Number(entry); entry="";
      if(mode==="q"){ queue.push(n); pushQueue(); } else { if(!banned.includes(n)) banned.push(n); banned.sort((a,b)=>a-b); pushBan(); } return; } }
  else if(entry.length<5) entry=(entry+b.textContent).replace(/^0+/,"");
  render(); });

$("bClose").onclick=()=>send({t:"close"});
$("bClear").onclick=()=>{ queue=[]; pushQueue(); };
$("bClearBan").onclick=()=>{ banned=[]; pushBan(); };
$("seg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.m; render(); });

$("codeBtn").onclick=()=>{ $("inCode").value=room; $("sheet").hidden=false; };
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("sheet").hidden=true; });
$("bNew").onclick=()=>{ $("inCode").value=gen(); };
$("bSave").onclick=()=>{ const v=$("inCode").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""); if(v.length>=4){ room=v; try{localStorage.setItem("garapon-ctl-room",room);}catch(e){} state=null; lastSeen=0; connect(); render(); } $("sheet").hidden=true; };

document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ connect(); } });
setInterval(()=>{ render(); if(Date.now()-lastSeen>20000) send({t:"hello"}); },10000);
connect(); render();
})();
</script>
</body>
</html>
